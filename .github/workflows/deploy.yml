name: Data + deploy BonzStakes

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 */6 * * *" # fresh fixtures, odds and results every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: edgebook/package-lock.json

      - name: Fetch football-data.co.uk
        run: node scripts/fetch-data.mjs 5

      # Pushed from a separate temporary repo, so the working copy (and data/raw) is never touched.
      - name: Keep a copy of the raw data on the data branch
        if: always()
        run: |
          rm -rf /tmp/databranch && cp -r data/raw /tmp/databranch && cd /tmp/databranch
          git init -q && git checkout -q -b data
          git -c user.name="bonzstakes-bot" -c user.email="bonzstakes-bot@users.noreply.github.com" add -A
          git -c user.name="bonzstakes-bot" -c user.email="bonzstakes-bot@users.noreply.github.com" commit -q -m "data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - run: npm ci
        working-directory: edgebook
      - run: npm test
        working-directory: edgebook

      - name: Build the app's data file
        working-directory: edgebook
        run: npx tsx ../scripts/build-data.ts ../data/raw public/data

      - name: Build static site
        working-directory: edgebook
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Check the real data made it into the site
        run: test -s edgebook/out/data/live.json

      # A small report on the status branch, so the result can be checked without opening Actions.
      - name: Report build status
        if: always()
        run: |
          rm -rf /tmp/status && mkdir /tmp/status && cd /tmp/status
          n=$(node -e "try{console.log(require('$GITHUB_WORKSPACE/edgebook/out/data/live.json').fixtures.length)}catch(e){console.log(-1)}")
          echo "{\"run\": \"${{ github.run_id }}\", \"commit\": \"${{ github.sha }}\", \"outcome\": \"${{ job.status }}\", \"fixtures\": $n, \"at\": \"$(date -u +%FT%TZ)\"}" > status.json
          cat status.json
          git init -q && git checkout -q -b status && git add -A
          git -c user.name="bonzstakes-bot" -c user.email="bonzstakes-bot@users.noreply.github.com" commit -q -m "status"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status

      - uses: actions/upload-pages-artifact@v3
        with:
          path: edgebook/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
